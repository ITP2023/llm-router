[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"

[lib]
name = "llm_router"
path = "src/lib.rs"

[[bin]]
name = "llm-router"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream = "0.1"
async-stream = "0.3"
dotenvy = "0.15"
futures-util = "0.3"
bytes = "1"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
